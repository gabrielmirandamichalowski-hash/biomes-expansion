
name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore BiomesExpansion.csproj

      - name: Build
        run: dotnet build BiomesExpansion.csproj -c Release --no-restore -o out

      - name: Empacotar .scmod
        run: |
          mkdir -p pack/Assets/Textures
          cp out/BiomesExpansion.dll pack/
          cp modinfo.json pack/
          cp JungleBlocks.png pack/Assets/Textures/
          cd pack
          zip -r ../BiomesExpansion.scmod .

      - uses: actions/upload-artifact@v4
        with:
          name: BiomesExpansion-scmod
          path: BiomesExpansion.scmod
